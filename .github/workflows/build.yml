name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # ключ Firebase відновлюю із секрету; без секрету збирається версія без push-сповіщень
      - name: Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > mobile-client/google-services.json
            echo "google-services.json відновлено"
          else
            echo "секрет GOOGLE_SERVICES_JSON не задано, збірка без FCM"
          fi

      - name: Tests, server and APK
        run: ./gradlew --no-daemon --stacktrace test :pc-server:installDist :mobile-client:assembleDebug :mobile-client:recordPaparazziDebug :mobile-client:createDebugUnitTestCoverageReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: remotepad-debug-apk
          path: mobile-client/build/outputs/apk/debug/*.apk

      # знімки екранів Paparazzi; з них взято рисунки розділу 3 звіту
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: mobile-client/src/test/snapshots/images/*.png

      # заміри наскрізного тесту на loopback і покриття коду клієнта
      - name: Upload measurements and coverage
        uses: actions/upload-artifact@v4
        with:
          name: measurements
          path: |
            mobile-client/build/measurements/*.json
            mobile-client/build/reports/coverage/test/debug/report.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/test-results/**/*.xml'

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Times New Roman потрібен, щоб підписи на діаграмах збігалися зі шрифтом звіту
      - name: Graphviz and fonts
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -q
          sudo apt-get install -yq graphviz ttf-mscorefonts-installer

      - name: Render PlantUML
        run: |
          curl -sSL -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar
          java -Djava.awt.headless=true -jar plantuml.jar -charset UTF-8 -tpng -Sdpi=200 -o rendered docs/diagrams/*.puml

      - name: Upload diagrams
        uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: docs/diagrams/rendered/*.png
